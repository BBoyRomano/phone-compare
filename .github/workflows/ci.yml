name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan affected workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_apps: ${{ steps.impact.outputs.has_apps }}
      matrix: ${{ steps.impact.outputs.matrix }}
      shared: ${{ steps.impact.outputs.shared }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: corepack enable
      - name: Verify workspace policy and impact planner
        run: pnpm run check:workspace
      - name: Compute dependency-aware impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tooling/affected-workspaces.mjs --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  shared:
    name: Shared packages
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify shared packages
        run: pnpm --recursive --filter './packages/*' check

  app:
    name: ${{ matrix.app }} app
    needs: changes
    if: needs.changes.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install phone browser runtime
        if: matrix.browserTests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify app
        run: pnpm --filter ${{ matrix.package }} check

  result:
    name: CI result
    needs: [changes, shared, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every planned check to pass
        env:
          APP_RESULT: ${{ needs.app.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHARED_RESULT: ${{ needs.shared.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$APP_RESULT" = success -o "$APP_RESULT" = skipped
          test "$SHARED_RESULT" = success -o "$SHARED_RESULT" = skipped
