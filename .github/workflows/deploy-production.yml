name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep the active deployment running and retain only the newest pending main run.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://phone-compare.bboyromano.workers.dev

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify project and build production artifact
        run: pnpm check

      - name: Validate generated Worker configuration
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json

      - name: Deploy existing Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.120.0"
          packageManager: pnpm
          command: deploy --config dist/server/wrangler.json

      - name: Smoke test production
        shell: bash
        env:
          PRODUCTION_URL: https://phone-compare.bboyromano.workers.dev
        run: |
          set -euo pipefail

          home_metadata="$(
            curl --proto '=https' --tlsv1.2 \
              --fail-with-body --silent --show-error --location \
              --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 \
              --output "${RUNNER_TEMP}/production-home.html" \
              --write-out '%{http_code} %{content_type}' \
              "${PRODUCTION_URL}/"
          )"
          read -r home_status home_content_type <<< "${home_metadata}"

          if [[ ! "${home_status}" =~ ^2[0-9]{2}$ ]]; then
            echo "Expected the production home page to return 2xx; received ${home_status}." >&2
            exit 1
          fi
          if [[ "${home_content_type}" != text/html* ]]; then
            echo "Expected the production home page to be HTML; received ${home_content_type}." >&2
            exit 1
          fi
          if ! grep --quiet --ignore-case '<html' "${RUNNER_TEMP}/production-home.html"; then
            echo "Expected the production home page body to contain an HTML document." >&2
            exit 1
          fi

          unknown_status="$(
            curl --proto '=https' --tlsv1.2 \
              --silent --show-error --location \
              --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "${PRODUCTION_URL}/__deployment-smoke/unknown-route"
          )"

          if [[ "${unknown_status}" != "404" ]]; then
            echo "Expected an unknown production route to return 404; received ${unknown_status}." >&2
            exit 1
          fi
