name: Deploy production apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: App id to release, or "all"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  changes:
    name: Plan production releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_apps: ${{ steps.impact.outputs.has_apps }}
      matrix: ${{ steps.impact.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Compute dependency-aware release plan
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          SELECTED_APP: ${{ inputs.app }}
        run: |
          if [[ -n "$SELECTED_APP" ]]; then
            node tooling/affected-workspaces.mjs --select "$SELECTED_APP" --github-output "$GITHUB_OUTPUT"
          else
            node tooling/affected-workspaces.mjs --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Release ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    concurrency:
      group: production-${{ matrix.app }}
      cancel-in-progress: false
    environment:
      name: production-${{ matrix.app }}
      url: ${{ matrix.productionUrl }}
    env:
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install browser runtime
        if: matrix.browserTests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify app and all internal dependencies
        run: pnpm --filter "${{ matrix.package }}..." check
      - name: Require app-scoped D1 identity
        shell: bash
        run: |
          [[ "${CLOUDFLARE_D1_DATABASE_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
      - name: Validate generated Worker configuration
        run: pnpm exec wrangler deploy --dry-run --config "apps/${{ matrix.app }}/dist/server/wrangler.json"
      - name: Verify remote D1 identity
        shell: bash
        run: |
          pnpm exec wrangler d1 info "${{ matrix.databaseName }}" --json > "${RUNNER_TEMP}/d1-info.json"
          node tooling/verify-d1-identity.mjs "${RUNNER_TEMP}/d1-info.json" "${{ matrix.databaseName }}" "${CLOUDFLARE_D1_DATABASE_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply forward-only catalogue schema migrations
        run: pnpm exec wrangler d1 migrations apply CATALOG_DB --remote --config "apps/${{ matrix.app }}/dist/server/wrangler.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish the verified catalogue projection
        run: pnpm exec wrangler d1 execute CATALOG_DB --remote --config "apps/${{ matrix.app }}/dist/server/wrangler.json" --file "apps/${{ matrix.app }}/dist/catalog/catalog.sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy app Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.120.0"
          packageManager: pnpm
          command: deploy --config "apps/${{ matrix.app }}/dist/server/wrangler.json"
      - name: Smoke test production identity and routing
        shell: bash
        env:
          PRODUCTION_URL: ${{ matrix.productionUrl }}
          SMOKE_MARKER: ${{ matrix.smokeMarker }}
        run: |
          set -euo pipefail
          home_metadata="$(curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 --output "${RUNNER_TEMP}/production-home.html" --write-out '%{http_code} %{content_type}' "${PRODUCTION_URL}/")"
          read -r home_status home_content_type <<< "${home_metadata}"
          [[ "${home_status}" =~ ^2[0-9]{2}$ ]]
          [[ "${home_content_type}" == text/html* ]]
          grep --fixed-strings --quiet "${SMOKE_MARKER}" "${RUNNER_TEMP}/production-home.html"
          catalog_status="$(curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 "${PRODUCTION_URL}/api/catalog/status")"
          grep --fixed-strings --quiet '"appId":"${{ matrix.app }}"' <<< "${catalog_status}"
          unknown_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 --output /dev/null --write-out '%{http_code}' "${PRODUCTION_URL}/__deployment-smoke/unknown-route")"
          [[ "${unknown_status}" == "404" ]]
